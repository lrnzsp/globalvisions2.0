name = "gv-store"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Public address: the globalvisions.it zone is on Cloudflare, so the Worker is served
# on its own custom domain. workers.dev stays on only as a fallback for debugging.
routes = [{ pattern = "api.globalvisions.it", custom_domain = true }]

[vars]
PUBLIC_ORIGIN = "https://globalvisions.it"
STORE_API_ORIGIN = "https://api.globalvisions.it"
# Set to "false" only if the Stripe account has no Terms of Service URL yet.
REQUIRE_TOS_CONSENT = "true"

[[d1_databases]]
binding = "DB"
database_name = "gv-store"
database_id = "37889644-30f6-4420-93f1-8327da52baeb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TRACKS"
bucket_name = "gv-tracks"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
